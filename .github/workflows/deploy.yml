name: Deploy to Production

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
      VITE_OPENAI_API_KEY: ${{ secrets.VITE_OPENAI_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Validate required secrets
        run: |
          echo "Validating required secrets..."
          if [ -z "${VITE_SUPABASE_URL}" ]; then
            echo "Error: VITE_SUPABASE_URL secret is not set"
            exit 1
          fi
          if [ -z "${VITE_SUPABASE_ANON_KEY}" ]; then
            echo "Error: VITE_SUPABASE_ANON_KEY secret is not set"
            exit 1
          fi
          if [ -z "${VITE_SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "Warning: VITE_SUPABASE_SERVICE_ROLE_KEY secret is not set - Admin functionality will be limited"
          fi
          if [ -z "${VITE_OPENAI_API_KEY}" ]; then
            echo "Error: VITE_OPENAI_API_KEY secret is not set"
            exit 1
          fi
          echo "All required secrets are present"

      - name: Build application
        run: npm run build

      - name: Validate deployment secrets
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "Validating deployment secrets..."
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "Warning: VERCEL_TOKEN secret is not set - Vercel deployment will be skipped"
          fi
          if [ -z "${NETLIFY_AUTH_TOKEN}" ]; then
            echo "Warning: NETLIFY_AUTH_TOKEN secret is not set - Netlify deployment will be skipped"
          fi
          echo "Deployment secret validation complete"

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          vercel-token: ${{ env.VERCEL_TOKEN }}
          vercel-org-id: ${{ env.VERCEL_ORG_ID }}
          vercel-project-id: ${{ env.VERCEL_PROJECT_ID }}
          working-directory: ./

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          publish-dir: "./dist"
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
          enable-pull-request-comment: false
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ env.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ env.NETLIFY_SITE_ID }}
